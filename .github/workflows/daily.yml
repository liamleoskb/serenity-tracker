name: Daily Market Voices Tracker

# The tracker now makes ONE Apify run per execution covering all accounts
# (max_items is global per run, per the actor's documentation), so the free
# plan's 10-runs-per-day limit is no longer a constraint.
#
# Schedule stays commented out until one manual run returns real posts.
on:
  # schedule:
  #   - cron: "30 22 * * *"    # 22:30 UTC = 07:30 KST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:                     # never let two runs overlap
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis tools
        run: pip install --quiet yfinance

      - name: Run the tracker
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR_ID: ${{ secrets.APIFY_ACTOR_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_HANDLES: aleabitoreddit,gmpnavi,NURadu_,TheObserverLee,Alisvolatprop12
          MAX_ITEMS: "100"        # documented minimum run size
          LOOKBACK_DAYS: "2"      # 1 day of overlap; higher may re-bill tweets
          SEARCH_SORT: "Latest"   # newest first; "Top" returns more but unordered
          TWEET_TYPE: "exclude_retweets"   # retweets would misattribute authorship
        run: python serenity_tracker.py

      - name: Run the analysis
        run: python analyze.py

      - name: Save results back to the repository
        run: |
          git config user.name "tracker-bot"
          git config user.email "actions@github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "Tracker update $(date -u +%Y-%m-%d)"
          git push
