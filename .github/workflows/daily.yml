name: Daily Market Voices Tracker

# One Apify run per day, budget-guarded. The script refuses to fetch if the
# remaining budget could not absorb a worst-case run, and refuses a second
# run on the same UTC date, so overspending is structurally impossible.
on:
  # Uncomment after one manual run succeeds:
  # schedule:
  #   - cron: "30 22 * * *"    # 22:30 UTC = 07:30 KST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis tools
        run: pip install --quiet yfinance

      - name: Run the tracker
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR_ID: ${{ secrets.APIFY_ACTOR_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_HANDLES: aleabitoreddit,NURadu_,Alisvolatprop12
          GEMINI_MODEL: "gemini-3.6-flash"
          MAX_ITEMS: "100"        # documented minimum run size
          LOOKBACK_DAYS: "1"      # smallest window = lowest cost
          SEARCH_SORT: "Latest"
          TWEET_TYPE: "exclude_retweets"
          BUDGET_USD: "1.70"      # raise this after your Apify credit resets
          # FORCE_RUN: "1"        # uncomment only to override the same-day guard
        run: python serenity_tracker.py

      - name: Run the analysis
        run: python analyze.py

      - name: Save results back to the repository
        run: |
          git config user.name "tracker-bot"
          git config user.email "actions@github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "Tracker update $(date -u +%Y-%m-%d)"
          git push
