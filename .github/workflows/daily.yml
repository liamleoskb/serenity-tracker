# Place this file at: .github/workflows/daily.yml  (exact path matters!)
name: Daily Serenity Tracker

on:
  schedule:
    - cron: "30 22 * * *"   # 22:30 UTC = 07:30 in Korea, every day
  workflow_dispatch: {}      # lets you press "Run workflow" manually

permissions:
  contents: write            # allows the workflow to save results back to the repo

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the tracker
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR_ID: ${{ secrets.APIFY_ACTOR_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_HANDLE: aleabitoreddit
        run: python serenity_tracker.py

      - name: Save results back to the repository
        run: |
          git config user.name "tracker-bot"
          git config user.email "actions@github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "Daily tracker update"
          git push
