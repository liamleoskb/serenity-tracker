name: Daily Market Voices Tracker

on:
  schedule:
    - cron: "30 22 * * *"   # 22:30 UTC = 07:30 KST daily
                             # change to "30 22 */2 * *" to run every 2 days
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the tracker
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR_ID: ${{ secrets.APIFY_ACTOR_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_HANDLES: aleabitoreddit,gmpnavi,NURadu_,TheObserverLee,Alisvolatprop12
          MAX_POSTS: "100"
        run: python serenity_tracker.py

      - name: Save results back to the repository
        run: |
          git config user.name "tracker-bot"
          git config user.email "actions@github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "Daily tracker update"
          git push
